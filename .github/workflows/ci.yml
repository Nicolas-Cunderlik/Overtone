name: CI

# Every commit pushed to a PR targeting main, and every merge (push) to main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    # Unit tests cover platform-independent logic; anything touching the
    # Win32 window APIs belongs in a windows-latest job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Type check here rather than in the lint job: pyright needs the app's dependencies installed
      - run: pyright
      # Includes tests/unit/research: the research pipeline's normalization layer is pure Python
      - run: pytest tests/unit
