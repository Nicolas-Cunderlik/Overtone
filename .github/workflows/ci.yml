name: CI

# Every commit pushed to a PR targeting main, and every merge (push) to main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    # Unit tests cover platform-independent logic; anything touching the
    # Win32 window APIs belongs in a windows-latest job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: pip install uv==0.13.6
      # The whole workspace from the lock (app, core, research; CPU torch on Linux)
      - run: uv sync --locked
      # Type check here rather than in the lint job: pyright needs the dependencies installed
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest tests/unit
