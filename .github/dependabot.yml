# Version updates: the workspace's dependencies (uv.lock) and CI actions, monthly, one grouped PR each.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
    # The embedding stack: live songs are only comparable with catalog songs embedded by the same
    # versions, so these move only together with a rebuilt stem index. Security PRs still arrive.
    ignore:
      - dependency-name: torch
      - dependency-name: torchaudio
      - dependency-name: demucs
      - dependency-name: muq
      - dependency-name: transformers
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
