[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "overtone"
version = "0.1.0"
description = "Song insights docked beside the Spotify desktop app: AI chord progressions and similar tracks."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Cunderlik", email = "nicolas7cunderlik@gmail.com" }]
requires-python = ">=3.13"
# An application, not a library: exact pins so every install runs what was tested.
# The single uv.lock at the repo root pins the whole workspace (app, core, research).
dependencies = [
    "overtone-core",
    "numpy==2.5.4",
    "PyQt5==5.15.11",
    "requests==2.34.2",
    "spotipy==2.26.0",
    "openai==3.37.0",
    "pydantic==2.14.1",
    "platformdirs==4.13.5",
]

[dependency-groups]
# `uv sync` installs this group: the dev environment is the app plus the research pipeline
dev = [
    "stemsim",
    "pytest==9.1.1",
    "pre-commit==4.7.0",
    "ruff==0.17.2",  # keep in step with the rev in .pre-commit-config.yaml
    "pyright==1.1.414",  # same engine as Pylance; needs Node.js (fetched automatically if missing)
]

[project.scripts]
overtone = "overtone.__main__:main"

[project.gui-scripts]
overtone-gui = "overtone.__main__:main"  # no console window; the installer's shortcuts start it

[tool.setuptools]
# Only the package-data listed below: the optional title font in assets/ is
# licensed separately and must never ship in a wheel
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
overtone = ["assets/*.png"]

[tool.uv.workspace]
members = ["packages/core", "research/stem_similarity"]

[tool.uv]
# Resolve for the two platforms in use: Windows (the app, dev) and Linux (CI)
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
overtone-core = { workspace = true }
stemsim = { workspace = true }
# CUDA build on Windows; CPU build on Linux CI, which has no GPU
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
# Basic mode over the app and core packages. Windows is the only target, so ctypes.windll & co.
# resolve even when CI runs on Linux.
include = ["src", "packages/core/src"]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks
# Offline research scripts: fixed https URLs, a fixed ffmpeg binary, and
# random sampling for experiment design (not cryptography)
"research/**" = ["S310", "S311", "S603"]
"research/**/tests/**" = ["S101"]
"tests/unit/research/**" = ["S311"]  # seeded RNGs exercise the research samplers
# Service clients call fixed https APIs
"packages/core/src/overtone_core/clients/**" = ["S310"]
# Utility scripts launch fixed commands (venv python, git, mlflow) by design
"scripts/**" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "preserve"  # the codebase mixes quote styles; don't churn every line

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
